<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Приглашение на свидание</title>
<style>
  body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #ff9a9e, #fad0c4); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
  .card { background: white; border-radius: 20px; padding: 30px; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
  h1 { color: #d6336c; font-size: 24px; }
  label { display: block; margin: 15px 0 5px; font-weight: bold; color: #333; text-align: left; }
  input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
  button { margin-top: 20px; background: #d6336c; color: white; border: none; padding: 12px 24px; border-radius: 30px; font-size: 18px; cursor: pointer; width: 100%; }
  button:active { background: #b02a5b; }
</style>
</head>
<body>
<div class="card">
  <h1>💌 Привет, Киса!</h1>
  <p>Я хочу пригласить тебя на свидание. Помоги мне выбрать детали:</p>

  <form action="https://formspree.io/f/xqpqngen" method="POST">
    
    <label for="date">📅 Когда тебе удобно? (с 20 декабря)</label>
    <input type="date" id="date" name="date" min="2026-12-20" required>

    <label for="place">📍 Куда пойдём?</label>
    <select id="place" name="place">
      <option>Кафе</option>
      <option>Кино</option>
      <option>Коялов Бор</option>
      <option>Ужин дома с шампанским</option>
    </select>

    <label for="wish">✨ Твои пожелания</label>
    <textarea id="wish" name="wish" rows="3" placeholder="Например: хочу сладкое..."></textarea>

    <button type="submit">Отправить 💕</button>
  </form>
</div>
</body>
</html>
